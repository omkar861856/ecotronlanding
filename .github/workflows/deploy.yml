name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # Add server to known_hosts (prevents host verification error)
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_IP" << 'EOF'
            set -e
            
            # Go to project folder (must match repo name)
            cd /root/${{ github.event.repository.name }}
            
            # Pull latest code
            git pull origin main
            
            # Rebuild + restart container
            docker compose down
            docker compose up -d --build
            
            # Cleanup old images (optional but good)
            docker image prune -f
          EOF
